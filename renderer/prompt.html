<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bloom</title>
  <link rel="stylesheet" href="settings.css?v=3">
  <style>
    body { display: grid; place-items: center; background: var(--bg); -webkit-app-region: drag; }
    form { width: 100%; padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; -webkit-app-region: no-drag; }
    h1 { font-size: 15px; font-weight: 600; }
    p { color: var(--ink-dim); font-size: 12.5px; }
    input { height: 34px; padding: 0 10px; border-radius: var(--r-ctl); background: var(--elev); border: 1px solid var(--line); color: var(--ink); }
    input:focus { border-color: var(--acc); }
    .row { display: flex; justify-content: flex-end; gap: 8px; }
  </style>
</head>
<body>
  <form id="f">
    <h1 id="t">Set a password</h1>
    <p id="d">Anyone opening the PDF will need it. Bloom can't recover it.</p>
    <input id="pw" type="password" autocomplete="off" spellcheck="false" aria-label="Password">
    <div class="row"><button type="button" class="btn btn-sm btn-ghost" id="no">Cancel</button><button class="btn btn-sm btn-primary" id="ok">Protect</button></div>
  </form>
  <script>
    const done = v => window.bloom.promptDone(v);
    document.getElementById('f').onsubmit = e => { e.preventDefault(); const v = document.getElementById('pw').value; if (v) done(v); };
    document.getElementById('no').onclick = () => done(null);
    window.addEventListener('keydown', e => { if (e.key === 'Escape') done(null); });
    document.getElementById('pw').focus();
  </script>
</body>
</html>
